# HTTPS nginx + php-fpm site for the GLPI Audit Dashboard.
#
# Use this instead of nginx-glpi-dashboard.conf when you need the camera
# "Scan" page: browsers only expose the camera (getUserMedia) on HTTPS or
# localhost, so over a LAN IP the dashboard MUST be served over https://.
#
# Install:
#   # 1. Make a certificate for the address you'll open (container IP):
#   sudo bash deploy/make-selfsigned-cert.sh 10.0.0.184
#
#   # 2. Enable the site:
#   sudo apt install -y nginx php-fpm
#   sudo cp deploy/nginx-glpi-dashboard-ssl.conf /etc/nginx/sites-available/glpi-dashboard
#   sudo ln -sf /etc/nginx/sites-available/glpi-dashboard /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Confirm your php-fpm socket path and update fastcgi_pass below:
#   ls /run/php/          # e.g. php8.3-fpm.sock
#
# Runtime dirs must be writable by the web user:
#   sudo chown -R www-data:www-data \
#        /opt/glpi-middleware-api/web-dashboard/storage \
#        /opt/glpi-middleware-api/web-dashboard/bootstrap/cache

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/glpi-dashboard/dashboard.crt;
    ssl_certificate_key /etc/ssl/glpi-dashboard/dashboard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /opt/glpi-middleware-api/web-dashboard/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;              # so Laravel builds https:// URLs
        include fastcgi_params;
    }

    # Deny access to hidden files (.env, .git, etc.), except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
