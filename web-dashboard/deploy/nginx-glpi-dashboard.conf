# nginx + php-fpm site for the GLPI Audit Dashboard.
#
# Install:
#   sudo apt install -y nginx php-fpm
#   sudo cp deploy/nginx-glpi-dashboard.conf /etc/nginx/sites-available/glpi-dashboard
#   sudo ln -s /etc/nginx/sites-available/glpi-dashboard /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Check your php-fpm socket path and update fastcgi_pass below:
#   ls /run/php/          # e.g. php8.3-fpm.sock
#
# Make sure the web user can read the app and write runtime dirs:
#   sudo chown -R www-data:www-data /opt/glpi-middleware-api/web-dashboard/storage \
#        /opt/glpi-middleware-api/web-dashboard/bootstrap/cache

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/glpi-middleware-api/web-dashboard/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files (.env, .git, etc.), except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
